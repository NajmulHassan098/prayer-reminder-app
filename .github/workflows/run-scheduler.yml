name: Run prayer scheduler

# BACKUP trigger for the prayer reminder scheduler.
#
# IMPORTANT: GitHub's `schedule:` is BEST-EFFORT, not a real-time clock. On a
# quiet repo it is frequently delayed 10-30+ minutes or skipped entirely — which
# is exactly why reminders were arriving late or in clustered bursts (a late tick
# finds several events already past their send window). Do NOT rely on this
# workflow as the primary trigger.
#
# PRIMARY trigger: a dedicated external HTTP scheduler (cron-job.org free tier or
# Upstash QStash) that calls POST /api/cron/prayer-scheduler with the Bearer
# CRON_SECRET every 1 minute. See README "Reliable 1-minute trigger" for setup.
# The tick is idempotent and cheap (one DB read per user + atomic claims), so a
# 1-minute cadence is safe. This workflow stays as a belt-and-braces backup, and
# the Vercel daily cron in vercel.json is the last-resort backstop.
#
# To enable it, add these two Repository Secrets (GitHub -> Settings -> Secrets
# and variables -> Actions):
#   CRON_URL     e.g. https://prayer-app-sepia.vercel.app/api/cron/prayer-scheduler
#   CRON_SECRET  the same value you set as the CRON_SECRET env var on Vercel

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger prayer scheduler
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Fail fast with a readable message if a secret is missing/empty
          # (silently expanding to "Bearer " causes a confusing 401).
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_URL or CRON_SECRET Actions secret is not set (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          # Capture the HTTP code so auth failures are explained, not just exit 22.
          CODE=$(curl -sS -X POST "$CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -o /tmp/cron-response.json -w '%{http_code}')
          cat /tmp/cron-response.json; echo
          if [ "$CODE" = "401" ]; then
            echo "::error::401 Unauthorized — CRON_SECRET in GitHub Actions no longer matches the CRON_SECRET env var on Vercel. Re-sync them."
            exit 1
          elif [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::Scheduler trigger returned HTTP $CODE"
            exit 1
          fi

      - name: Verify heartbeat (proof the scheduler actually ticked)
        # Runs even when the trigger step failed, so the log always shows how
        # stale the scheduler is.
        if: always()
        # Reads /api/health on the same host the cron URL points at. Prints
        # staleFor (seconds since the last tick started) so a silent prod
        # failure (missing CRON_SECRET, missing SMTP, etc.) is visible in the
        # Action log without anyone having to open the site.
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "::warning::CRON_URL secret not set; skipping heartbeat check"
            exit 0
          fi
          HEALTH_URL=$(echo "$CRON_URL" | sed 's|/api/cron/prayer-scheduler$|/api/health|')
          echo "GET $HEALTH_URL"
          BODY=$(curl -sS "$HEALTH_URL")
          echo "$BODY"
          # Extract staleFor with pure shell (no jq dependency). If the field
          # is missing or above 900s, fail the run loudly.
          STALE=$(printf '%s' "$BODY" | tr ',' '\n' | grep '"staleFor"' | sed 's/.*: *\([0-9]*\).*/\1/')
          if [ -z "$STALE" ] || [ "$STALE" = "null" ]; then
            echo "::warning::cron_heartbeat row not found — apply migration 0007 and confirm tick() ran"
            exit 0
          fi
          if [ "$STALE" -gt 900 ]; then
            echo "::error::scheduler looks stale (last tick $STALEs ago — >15min). Check CRON_SECRET / SMTP env vars on Vercel"
            exit 1
          fi
          echo "Heartbeat fresh (last tick $STALEs ago)."
